[general]
framerate = 15
bars = 16
autosens = 1
sensitivity = 125
scaling = linear
lower_cutoff_freq = 45
higher_cutoff_freq = 12000
sleep_timer = 2

[input]
method = pipewire
source = auto
sample_rate = 48000
sample_bits = 16
active = 1
remix = 1
virtual = 1

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 68
